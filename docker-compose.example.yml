name: paper-trading-frontend

services:
  frontend:
    container_name: paper-trading-frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: paper-trading-frontend:local
    restart: unless-stopped
    ports:
      - '5173:8080'
    networks:
      - trading-backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  trading-backend:
    name: trading-platform_default
    external: true
